"$schema" = 'https://starship.rs/config-schema.json'

# Gradient: mauve → blue → sapphire → surface2
# Bright accents for identity/navigation, muted tones for context
format = """
[](mauve)\
$os\
$username\
$hostname\
[](bg:blue fg:mauve)\
$directory\
[](bg:sapphire fg:blue)\
$git_branch\
$git_status\
$git_state\
[](fg:sapphire bg:surface2)\
$rust\
$golang\
$nodejs\
$python\
$docker_context\
$kubernetes\
$battery\
[](fg:surface2)\
$cmd_duration\
$jobs\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:mauve fg:crust"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Debian = "󰣚"
Ubuntu = "󰕈"

[username]
show_always = true
style_user = "bg:mauve fg:crust"
style_root = "bg:mauve fg:crust"
format = '[ $user]($style)'

[hostname]
ssh_only = false
style = "bg:mauve fg:crust"
format = '[@$hostname ]($style)'

[directory]
style = "bg:blue fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol $branch ](fg:crust bg:sapphire)]($style)'

[git_status]
style = "bg:sapphire"
format = '[[($all_status$ahead_behind )](fg:crust bg:sapphire)]($style)'

# Mid-rebase / merge / cherry-pick / bisect, with progress (REBASING 2/5)
[git_state]
style = "bg:sapphire"
format = '[[ $state( $progress_current/$progress_total) ](bold fg:crust bg:sapphire)]($style)'

[nodejs]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:green bg:surface2)]($style)'

[rust]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:peach bg:surface2)]($style)'

[golang]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version) ](fg:sapphire bg:surface2)]($style)'

[python]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:yellow bg:surface2)]($style)'

[docker_context]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol( $context) ](fg:sky bg:surface2)]($style)'

# Only in a directory with Kubernetes files (charts, kustomize, k8s/), where
# the current context is what the next command hits. Not on every prompt: a
# kubeconfig existing says nothing about whether you're about to use it.
# (detect_env_vars = ["KUBECONFIG"] can't be added: in starship 1.26 it's
# ignored once file detection is set, rather than either one triggering.)
[kubernetes]
disabled = false
symbol = "󱃾"
style = "bg:surface2"
format = '[[ $symbol $context( \($namespace\)) ](fg:blue bg:surface2)]($style)'
detect_files = ["kustomization.yaml", "Chart.yaml", "helmfile.yaml", "skaffold.yaml", "Tiltfile"]
detect_folders = ["k8s", "kubernetes", "charts", "helm"]

[cmd_duration]
min_time = 3_000
format = " in $duration "

# Background jobs (Ctrl+Z, `cmd &`): a ✦, with the count from 2
[jobs]
format = "[$symbol$number ]($style)"
style = "bold fg:blue"

[battery]
# Shares the surface2 segment with the language modules (usually empty here),
# so the segment always has content and never renders as an empty nub. Always
# visible as a glanceable charge indicator (thresholds up to 100 match any
# level). Foreground grades red → yellow → green over the surface2 background;
# nerd-font glyphs from Maple Mono NF.
format = '[ $symbol $percentage ]($style)'
full_symbol = '󰁹'
charging_symbol = '󰂄'
discharging_symbol = '󰂃'
unknown_symbol = '󰁽'
empty_symbol = '󰂎'

[[battery.display]]
threshold = 20
style = 'bold fg:red bg:surface2'

[[battery.display]]
threshold = 50
style = 'fg:yellow bg:surface2'

[[battery.display]]
threshold = 100
style = 'fg:green bg:surface2'

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

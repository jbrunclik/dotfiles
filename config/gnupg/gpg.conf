# No `pinentry-mode loopback` here: it makes gpg read the passphrase from its
# own terminal instead of asking gpg-agent to show pinentry-mac, so anything
# that runs gpg without a TTY (scripts, password helpers, agent sessions)
# fails with "cannot open '/dev/tty'". Where there is no GUI (SSH), use
# loopback for that one command: gpg --pinentry-mode loopback ...
#
# `use-agent` is gone too: GnuPG 2.x always uses the agent and ignores it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4 luajit jq python3-yaml

      - name: Shellcheck
        run: shellcheck install.sh drift.sh gh-new-repo hyper-cheatsheet wallpaper lib/links.sh bash_profile bashrc config/git/hooks/pre-commit config/git/hooks/pre-push config/claude/bootstrap.sh .claude/hooks/check-config.sh

      - name: Python syntax
        run: |
          for f in keyboardio-backup keyboardio-layers lib/kaleidoscope_focus.py; do
              python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      # Hammerspoon embeds Lua 5.4, Neovim LuaJIT (5.1 plus extensions): each
      # is parsed by the Lua that will run it. LuaJIT parses with loadfile, not
      # `luajit -b`, which require()s jit.bcsave through a path that includes
      # the checkout's ./?.lua.
      - name: Lua syntax
        run: |
          find config -name '*.lua' -not -path 'config/nvim/*' -print0 | xargs -0 -n1 luac5.4 -p
          find config/nvim -name '*.lua' -print0 | xargs -0 -n1 sh -c 'LUA_FILE="$1" luajit -e "local ok, err = loadfile(os.getenv(\"LUA_FILE\")) if not ok then io.stderr:write(err, \"\\n\") os.exit(1) end"' _

      # Every tracked JSON file except VS Code's, which is JSONC (comments)
      - name: JSON syntax
        run: git ls-files -z '*.json' ':!config/vscode/*' | xargs -0 -r -n1 jq empty --

      - name: YAML syntax
        run: |
          python3 -c '
          import glob, sys, yaml
          for f in glob.glob(".github/**/*.yml", recursive=True):
              yaml.safe_load(open(f))
              print(f"ok {f}")
          '

      - name: Brewfile references a real formula for every required binary
        run: |
          # Every REQUIRED_BINS entry should be installable — catches the class
          # of bug where a config shells out to a tool nothing installs.
          # shellcheck disable=SC1091
          HOME=/tmp source lib/links.sh
          status=0
          for entry in "${REQUIRED_BINS[@]}"; do
              bin="${entry%%|*}"
              case "$bin" in
                  rg)          formula=ripgrep ;;
                  delta)       formula=git-delta ;;
            difft)       formula=difftastic ;;
                  tree-sitter) formula=tree-sitter-cli ;;
                  gm)          formula=graphicsmagick ;;
                  *)      formula="$bin" ;;
              esac
              if ! grep -qE "^brew \"$formula\"" Brewfile; then
                  echo "::error::$bin is required but Brewfile has no '$formula' entry"
                  status=1
              fi
          done
          exit $status

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4 luajit jq python3-yaml

      - name: Shellcheck
        run: shellcheck install.sh drift.sh gh-new-repo hyper-cheatsheet wallpaper lib/links.sh bash_profile bashrc config/git/hooks/pre-commit config/git/hooks/pre-push config/claude/bootstrap.sh .claude/hooks/check-config.sh

      - name: Python syntax
        run: |
          for f in keyboardio-backup keyboardio-layers lib/kaleidoscope_focus.py; do
              python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      # Hammerspoon embeds Lua 5.4, Neovim LuaJIT (5.1 plus extensions): each
      # is parsed by the Lua that will run it. LuaJIT parses with loadfile, not
      # `luajit -b`, which require()s jit.bcsave through a path that includes
      # the checkout's ./?.lua.
      - name: Lua syntax
        run: |
          find config -name '*.lua' -not -path 'config/nvim/*' -print0 | xargs -0 -n1 luac5.4 -p
          find config/nvim -name '*.lua' -print0 | xargs -0 -n1 sh -c 'LUA_FILE="$1" luajit -e "local ok, err = loadfile(os.getenv(\"LUA_FILE\")) if not ok then io.stderr:write(err, \"\\n\") os.exit(1) end"' _

      # Every tracked JSON file except VS Code's, which is JSONC (comments)
      - name: JSON syntax
        run: git ls-files -z '*.json' ':!config/vscode/*' | xargs -0 -r -n1 jq empty --

      - name: YAML syntax
        run: |
          python3 -c '
          import glob, sys, yaml
          for f in glob.glob(".github/**/*.yml", recursive=True):
              yaml.safe_load(open(f))
              print(f"ok {f}")
          '

      - name: Brewfile references a real formula for every required binary
        run: |
          # Every REQUIRED_BINS entry should be installable — catches the class
          # of bug where a config shells out to a tool nothing installs.
          # shellcheck disable=SC1091
          HOME=/tmp source lib/links.sh
          status=0
          for entry in "${REQUIRED_BINS[@]}"; do
              bin="${entry%%|*}"
              case "$bin" in
                  rg)          formula=ripgrep ;;
                  delta)       formula=git-delta ;;
            difft)       formula=difftastic ;;
                  tree-sitter) formula=tree-sitter-cli ;;
                  gm)          formula=graphicsmagick ;;
                  *)      formula="$bin" ;;
              esac
              if ! grep -qE "^brew \"$formula\"" Brewfile; then
                  echo "::error::$bin is required but Brewfile has no '$formula' entry"
                  status=1
              fi
          done
          exit $status

  # Things only a Mac can check: names in the Brewfile that Homebrew renamed
  # or dropped, the link step on a clean $HOME, and the Ghostty config. Free
  # for public repos.
  macos:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Every Brewfile formula and cask still exists
        run: |
          # Same parsing as drift.sh. One name at a time: a batch `brew info`
          # fails as a whole on the first unknown name.
          status=0 known=()
          while read -r f; do
              if brew info --formula --json=v2 "$f" > "$RUNNER_TEMP/info-f-${f//\//_}.json" 2>/dev/null; then
                  known+=("$RUNNER_TEMP/info-f-${f//\//_}.json")
              else
                  echo "::error::Brewfile: no formula '$f'"; status=1
              fi
          done < <(grep -E '^brew "' Brewfile | sed -E 's/^brew "([^"]+)".*/\1/')
          while read -r c; do
              if brew info --cask --json=v2 "$c" > "$RUNNER_TEMP/info-c-$c.json" 2>/dev/null; then
                  known+=("$RUNNER_TEMP/info-c-$c.json")
              else
                  echo "::error::Brewfile: no cask '$c'"; status=1
              fi
          done < <(grep -E '^cask "' Brewfile | sed -E 's/^cask "([^"]+)".*/\1/')
          # Disabled can't be installed any more; deprecated still installs
          # but is on its way out
          notes=$(jq -r '
              (.formulae + .casks)[]
              | (.full_token // .full_name) as $id
              | if .disabled then "::error::Brewfile: \($id) is disabled (\(.disable_reason // "no reason given"))"
                elif .deprecated then "::warning::Brewfile: \($id) is deprecated (\(.deprecation_reason // "no reason given"))"
                else empty end' "${known[@]}")
          [ -n "$notes" ] && echo "$notes"
          grep -q '::error::' <<< "$notes" && status=1
          echo "checked ${#known[@]} known formulae and casks"
          exit $status

      - name: Link step into an empty $HOME
        run: |
          export HOME="$RUNNER_TEMP/home" DOTFILES="$PWD"
          mkdir -p "$HOME"
          # shellcheck disable=SC1091
          source lib/links.sh
          status=0
          for entry in "${LINKS[@]}"; do
              src="$DOTFILES/${entry%%|*}" dst="${entry#*|}"
              [ -e "$src" ] || { echo "::error::LINKS: $src doesn't exist"; status=1; continue; }
              link "$src" "$dst" > /dev/null
              [ -e "$dst" ] && [ "$(readlink "$dst")" = "$src" ] \
                  || { echo "::error::LINKS: $dst doesn't resolve to $src"; status=1; }
          done
          echo "linked ${#LINKS[@]} entries into $HOME"
          exit $status

      - name: Ghostty config is valid
        run: |
          brew install --cask ghostty > /dev/null
          /Applications/Ghostty.app/Contents/MacOS/ghostty +validate-config --config-file="$PWD/config/ghostty/config"
